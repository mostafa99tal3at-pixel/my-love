<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix For Dalia</title>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <canvas id="matrixCanvas"></canvas>
    <script>
        const HEART_LINE_1 = "I will always love you ♥️"; 
        const HEART_LINE_2 = "Thank you for everything dalia"; 

        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            columns = Math.floor(canvas.width / fontSize);
            rainDrops = Array(columns).fill(1);
        });

        const matrixText = "love".split("");
        const fontSize = 14;
        let columns = Math.floor(canvas.width / fontSize);
        let rainDrops = Array(columns).fill(1);

        // 👇 ضفنا مرحلة INTRO في الأول عشان المطر ينزل لوحده بانتظام قبل الأرقام 👇
        let stages = ["INTRO", "3", "exp3", "2", "exp2", "1", "exp1", "you", "are", "my", "love", "explove2", "FINAL"];
        let currentStageIndex = 0;
        let stageTimer = 0;
        let particles = [];
        let heartActive = false;
        let pulseScale = 1;
        let pulseDirection = 1;

        function createTextParticles(text, isHeart) {
            particles = [];
            if (text === "INTRO") return; // في البداية مفيش نقط بتتجمع، مطر بس

            const memCanvas = document.createElement('canvas');
            const memCtx = memCanvas.getContext('2d');
            memCanvas.width = canvas.width;
            memCanvas.height = canvas.height;
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            if (isHeart) {
                for (let angle = 0; angle < Math.PI * 2; angle += 0.02) {
                    const r = 10 * pulseScale; 
                    const x = r * 16 * Math.pow(Math.sin(angle), 3);
                    const y = -r * (13 * Math.cos(angle) - 5 * Math.cos(2*angle) - 2 * Math.cos(3*angle) - Math.cos(4*angle));
                    particles.push({ x: centerX + (Math.random() - 0.5) * canvas.width, y: centerY + (Math.random() - 0.5) * canvas.height, targetX: centerX + x, targetY: centerY + y - 20, vx: 0, vy: 0, alpha: 0, speed: 0.04 + Math.random() * 0.03 });
                }
                return;
            }

            memCtx.fillStyle = '#fff';
            memCtx.textBaseline = 'middle';
            memCtx.textAlign = 'center';
            
            if (text.length === 1) { 
                memCtx.font = 'bold 150px system-ui'; 
            } else { 
                memCtx.font = '700 95px system-ui'; 
                memCtx.letterSpacing = "25px"; 
                text = text.toUpperCase(); 
            }
            memCtx.fillText(text, centerX, centerY);

            const imgData = memCtx.getImageData(0, 0, canvas.width, canvas.height);
            const step = text.length === 1 ? 10 : 11; 
            for (let y = 0; y < canvas.height; y += step) {
                for (let x = 0; x < canvas.width; x += step) {
                    const index = (y * canvas.width + x) * 4;
                    if (imgData.data[index + 3] > 128) {
                        particles.push({ x: centerX + (Math.random() - 0.5) * canvas.width, y: centerY + (Math.random() - 0.5) * canvas.height, targetX: x, targetY: y, vx: 0, vy: 0, alpha: 0, speed: 0.04 + Math.random() * 0.03 });
                    }
                }
            }
        }

        function explodeParticles() {
            for (let p of particles) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 4 + Math.random() * 5; 
                p.vx = Math.cos(angle) * speed; p.vy = Math.sin(angle) * speed;
            }
        }

        // البداية مع الانترو والمطر الرايق
        createTextParticles(stages[currentStageIndex], false);

        function draw() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.12)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // مطر كلمة love المنتظم والواضح باللون البينك النيون في الخلفية
            ctx.font = "bold " + fontSize + "px 'Courier New'";
            for (let i = 0; i < rainDrops.length; i++) {
                const charIndex = rainDrops[i] % matrixText.length;
                const text = matrixText[charIndex];
                
                ctx.fillStyle = 'rgba(255, 105, 180, 0.28)'; // زيادة الوضوح والتقل للمطر
                ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);
                
                if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.982) { rainDrops[i] = 0; }
                rainDrops[i]++;
            }

            stageTimer++;
            let currentStage = stages[currentStageIndex];

            if (currentStage.startsWith("exp")) {
                if (stageTimer > 45) { 
                    currentStageIndex++; stageTimer = 0;
                    if (stages[currentStageIndex] === "FINAL") { heartActive = true; createTextParticles("", true); } 
                    else { createTextParticles(stages[currentStageIndex], false); }
                }
            } else if (currentStage !== "FINAL") {
                let holdTime = 130;
                
                // 👇 1. الانترو يستنى فترة كافية (160 إطار) عشان المطر يملى الشاشة وينزل بانتظام قبل الـ 3 👇
                if (currentStage === "INTRO") holdTime = 160;
                
                // 👇 2. ضاعفت وقت بقاء الكلمات (you, are, my) لـ 240 إطار عشان تقعد ثابتة وبطيئة براحتها 👇
                if (currentStage === "you" || currentStage === "are" || currentStage === "my" || currentStage === "love") holdTime = 240; 

                if (stageTimer > holdTime) { 
                    if (currentStage === "INTRO") {
                        currentStageIndex++;
                        createTextParticles(stages[currentStageIndex], false);
                    } else if (currentStage === "3" || currentStage === "2" || currentStage === "1" || (currentStage === "love" && currentStageIndex === 9)) { 
                        explodeParticles(); 
                        stages[currentStageIndex] = "exp" + currentStage; 
                    } else { 
                        currentStageIndex++; 
                        createTextParticles(stages[currentStageIndex], false); 
                    }
                    stageTimer = 0;
                }
            }

            if (currentStage === "FINAL" && heartActive) {
                pulseScale += 0.008 * pulseDirection;
                if (pulseScale > 1.15 || pulseScale < 0.95) pulseDirection *= -1;
                const centerX = canvas.width / 2; const centerY = canvas.height / 2;
                let idx = 0;
                for (let angle = 0; angle < Math.PI * 2; angle += 0.02) {
                    if (idx >= particles.length) break;
                    const r = 10 * pulseScale; 
                    const x = r * 16 * Math.pow(Math.sin(angle), 3);
                    const y = -r * (13 * Math.cos(angle) - 5 * Math.cos(2*angle) - 2 * Math.cos(3*angle) - Math.cos(4*angle));
                    particles[idx].targetX = centerX + x; particles[idx].targetY = centerY + y - 20; idx++;
                }
            }

            for (let p of particles) {
                if (stages[currentStageIndex].startsWith("exp")) { p.x += p.vx; p.y += p.vy; p.alpha -= 0.02; } 
                else { p.x += (p.targetX - p.x) * p.speed; p.y += (p.targetY - p.y) * p.speed; if (p.alpha < 1) p.alpha += 0.05; }
                
                if (p.alpha > 0) {
                    ctx.beginPath();
                    if (currentStage === "FINAL") { 
                        ctx.fillStyle = `rgba(255, 51, 102, ${p.alpha})`; ctx.shadowBlur = 8; ctx.shadowColor = "#ff3366"; 
                        ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2); 
                    } else { 
                        ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`; 
                        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2); 
                    }
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            }

            if (currentStage === "FINAL") {
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.font = 'bold 16px system-ui'; ctx.fillStyle = '#ffffff'; ctx.shadowBlur = 15; ctx.shadowColor = '#ff3366';
                ctx.fillText(HEART_LINE_1, canvas.width / 2, canvas.height / 2 - 30);
                ctx.font = 'bold 13px system-ui'; ctx.fillStyle = 'rgba(255, 255, 255, 0.9)'; ctx.shadowBlur = 10; ctx.shadowColor = '#ff3366';
                ctx.fillText(HEART_LINE_2, canvas.width / 2, canvas.height / 2 + 10); ctx.shadowBlur = 0;
            }
            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>
